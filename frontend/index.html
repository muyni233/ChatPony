<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EFE5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13110E" />
    <meta name="description" content="ChatPony" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>ChatPony</title>
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('chatpony-theme');
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
