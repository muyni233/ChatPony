services:
  chatpony:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_PATH: "/app/data/chatpony.db"
      CHATPONY_STATIC_DIR: "/app/static"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
