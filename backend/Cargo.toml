[package]
name = "chatpony-backend"
version = "2.0.0"
edition = "2024"
default-run = "chatpony"

[[bin]]
name = "chatpony"
path = "src/main.rs"

[[bin]]
name = "create-admin"
path = "src/bin/create_admin.rs"

[[bin]]
name = "backup"
path = "src/bin/backup.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", default-features = false, features = ["libsqlite3-sys", "bundled", "backup", "serialize", "cache"] }
r2d2 = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "json", "stream"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder", "hostname"] }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
subtle = "2.6"
uuid = { version = "1", features = ["v4"] }
url = "2"
idna = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tyme4rs = "1.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
rpassword = "7"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
